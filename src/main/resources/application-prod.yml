spring:
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:h2:mem:dev}
    username: ${JDBC_DATABASE_USERNAME:Admin}
    password: ${JDBC_DATABASE_PASSWORD:Super}

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update

server:
  error:
    include-stacktrace: never

rsa:
  private-key: file:/run/secrets/jwt_private_key
  public-key: file:/run/secrets/jwt_public_key

sentry:
  dsn: ${SENTRY_AUTH_TOKEN:}

  data-collection:
    user-info: false

  tracesSampleRate: 1.0

  profileSessionSampleRate: 1.0
  profileLifecycle: TRACE

  logs:
    enabled: true

debug: true