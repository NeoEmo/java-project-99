name: SonarQube

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 25

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Generate ephemeral RSA keys for tests
        run: |
          mkdir -p src/main/resources/certs
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out src/main/resources/certs/private.pem
          openssl pkey -in src/main/resources/certs/private.pem -pubout -out src/main/resources/certs/public.pem
          chmod 600 src/main/resources/certs/private.pem

#      - name: Run tests and generate JaCoCo XML report
#        run: ./gradlew --no-daemon clean test jacocoTestReport
#
#      - name: Verify JaCoCo report
#        run: test -s build/reports/jacoco/test/jacocoTestReport.xml

      - name: Analyze with SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew build jacocoTestReport sonar --info
#        ./gradlew --no-daemon sonar
